<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 70" width="300" height="70">
  <!-- Transparent background version for navbar -->

  <!-- Sushi icon - red rounded square -->
  <rect x="0" y="5" width="58" height="58" rx="12" fill="#c0192e"/>
  <rect x="0" y="5" width="58" height="58" rx="12" fill="url(#sushiGradL)"/>

  <defs>
    <clipPath id="iconClipL">
      <rect x="0" y="5" width="58" height="58" rx="12"/>
    </clipPath>
    <linearGradient id="sushiGradL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e92e45"/>
      <stop offset="100%" stop-color="#9b1425"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#iconClipL)">
    <path d="M-5 48 Q22 20 62 10" stroke="#1a0a0e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-5 58 Q25 34 68 22" stroke="#1a0a0e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-3 70 Q28 48 72 34" stroke="#1a0a0e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M4 80 Q35 62 76 46" stroke="#1a0a0e" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- SUSHI MARKA text -->
  <text x="72" y="29" font-family="'Outfit', 'Nunito', Arial, sans-serif" font-size="22" font-weight="900" fill="#1e0e14" letter-spacing="1">SUSHI</text>
  <text x="72" y="57" font-family="'Outfit', 'Nunito', Arial, sans-serif" font-size="22" font-weight="900" fill="#1e0e14" letter-spacing="1">MARKA</text>
</svg>
