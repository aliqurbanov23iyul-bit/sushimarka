<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" width="420" height="140">
  <!-- Dark background version -->
  <rect width="420" height="140" fill="#1a0a0e" rx="0"/>

  <!-- Sushi icon - red rounded square -->
  <rect x="14" y="14" width="112" height="112" rx="22" fill="#c0192e"/>
  <rect x="14" y="14" width="112" height="112" rx="22" fill="url(#sushiGrad)"/>

  <!-- Salmon stripes -->
  <defs>
    <clipPath id="iconClip">
      <rect x="14" y="14" width="112" height="112" rx="22"/>
    </clipPath>
    <linearGradient id="sushiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0192e"/>
      <stop offset="100%" stop-color="#8b1120"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#iconClip)">
    <!-- Dark stripe lines -->
    <path d="M-10 90 Q40 40 120 20" stroke="#1a0a0e" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M-10 110 Q40 65 130 42" stroke="#1a0a0e" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M-10 130 Q50 90 140 65" stroke="#1a0a0e" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M5 148 Q60 115 148 90" stroke="#1a0a0e" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <!-- SUSHI text -->
  <text x="148" y="66" font-family="'Outfit', 'Nunito', Arial, sans-serif" font-size="46" font-weight="900" fill="white" letter-spacing="2">SUSHI</text>
  <!-- MARKA text -->
  <text x="148" y="118" font-family="'Outfit', 'Nunito', Arial, sans-serif" font-size="46" font-weight="900" fill="white" letter-spacing="2">MARKA</text>
</svg>
